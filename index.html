<title>Transporte Carro Viejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Bungee&family=Lobster&family=Archivo+Narrow:ital,wght@0,500;0,700;1,700&display=swap">
<style>
/* Layout: barra superior con pestañas tipo señal vial; cada pestaña es una tabla operativa con su formulario en un diálogo. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15191e; --muted:#5d6570; --line:#d5d9de; --soft:#e4e7eb;
  --plate:#f2c400; --plate-ink:#111111; --brand:#1b7a3c; --brand-ink:#ffffff; --brand-soft:#e3f2e8;
  --ok:#1d7f47; --warn:#a8670f; --bad:#c22f2f;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; --brand:#3fae66; --brand-ink:#0d1f14; --brand-soft:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#3fae66; --brand-ink:#0d1f14; --brand-soft:#16301f;
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 0}
.brand{color:var(--brand);font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand img{height:42px;width:auto;display:block}
.brand span{display:flex;flex-direction:column;line-height:.95}.brand small{font-size:13px;letter-spacing:.18em;font-style:italic}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{filter:brightness(1.6)}}:root[data-theme="dark"] .brand img{filter:brightness(1.6)}
header{border-bottom:3px solid var(--brand)!important}
.mode{font-size:13px;color:var(--muted);margin-left:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav a{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
main{padding-block:20px 48px}
.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.sub{color:var(--muted);margin:2px 0 0}
.grow{flex:1;min-width:0}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
button,.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:600}
button.link:hover{color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{width:auto;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi b.neg{color:var(--bad)} .kpi b.pos{color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px}
td.act{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.placa{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:4px;padding:1px 8px 0;font-family:var(--font-mono);font-weight:700;font-size:14px;letter-spacing:.06em;line-height:1.2;white-space:nowrap}
.placa small{font-family:var(--font-body);font-size:8px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;line-height:1.1;padding-bottom:1px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mu{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--soft);border-left:4px solid var(--warn)}
.alerts li.bad{border-left-color:var(--bad)}
.alerts li div{flex:1;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.btrack{display:flex;flex-direction:column;gap:3px}
.b{height:10px;border-radius:2px;min-width:2px}
.b.in{background:var(--ok)} .b.out{background:var(--bad);opacity:.75}
.bnum{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,12,15,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line)}
.db{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto}
.db .full{grid-column:1/-1}
@media (max-width:480px){.db{grid-template-columns:1fr}}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df .left{margin-right:auto}
td.chk,th.chk{width:34px;padding-right:0}
td.chk input{width:18px;height:18px;accent-color:var(--ink)}
.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.selbar button{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.selbar .link{color:var(--brand-ink);background:none;border:0}
.factno{font-family:var(--font-mono);font-size:12px;font-weight:700}
.pdflink{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.pdflink::before{content:"PDF";font-family:var(--font-body);font-size:10px;letter-spacing:.06em;background:var(--bad);color:#fff;border-radius:3px;padding:1px 4px;margin-right:6px}
#pdfStage{position:fixed;left:-10000px;top:0;width:760px;background:#fff}
#pdfStage .inv{min-width:0}
dialog.wide{width:min(860px,calc(100vw - 32px))}
.ib{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.paper{background:#ffffff;color:#16181b;border:1px solid var(--line);border-radius:6px;padding:28px;overflow-x:auto}
.inv{--g:#1b7a3c;font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;font-size:13px;line-height:1.3;color:#1b7a3c;min-width:640px;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv .ih{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.inv .jeep{width:185px;height:auto;display:block;margin-top:18px}
.inv .marca{display:flex;flex-direction:column;align-items:flex-start}
.inv .tr{font-family:"Archivo Narrow",Arial,sans-serif;font-style:italic;font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1;color:#fff;-webkit-text-stroke:1.4px var(--g);text-shadow:2px 2px 0 var(--g);margin-left:24px}
.inv .ban{background:var(--g);color:#fff;font-family:"Bungee",Impact,sans-serif;font-size:31px;line-height:1;padding:6px 14px 4px;margin-top:2px;letter-spacing:.01em;text-transform:lowercase}
.inv .chk{height:12px;width:100%;background:repeating-linear-gradient(90deg,var(--g) 0 14px,#fff 14px 28px);border:0 solid var(--g);border-width:0 0 1px}
.inv .chk.b{background:repeating-linear-gradient(90deg,#fff 0 14px,var(--g) 14px 28px)}
.inv .nit{font-size:20px;font-weight:500;margin:8px 0 0 30px;line-height:1.2;color:var(--g)}
.inv .der{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:200px}
.inv .fbox{border:1.5px solid var(--g);border-radius:8px;text-align:center;padding:2px 8px 6px}
.inv .fbox small{display:block;font-weight:700;font-size:11px;letter-spacing:.06em}
.inv .fbox .no{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;color:#d0202a;letter-spacing:.06em}
.inv .fbox .no i{font-style:normal;font-family:"Archivo Narrow",Arial,sans-serif;margin-right:14px;text-decoration:underline}
.inv .fecha{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--g);border-radius:8px;overflow:hidden}
.inv .fecha div{border-left:1px solid var(--g);text-align:center;padding:2px 0 4px}
.inv .fecha div:first-child{border-left:0}
.inv .fecha small{display:block;font-size:9px;font-weight:700}
.inv .fecha b{font-family:"JetBrains Mono",monospace;font-size:14px;color:#16181b;font-weight:500}
.inv .slogan{font-family:"Lobster",cursive;font-size:19px;line-height:1;text-align:center;color:#fff;-webkit-text-stroke:.9px var(--g);text-shadow:1.5px 1.5px 0 var(--g);transform:rotate(-3deg);margin-top:2px}
.inv .cli{border:1.5px solid var(--g);border-radius:10px;margin-top:6px}
.inv .cli>div{display:flex;gap:6px;align-items:baseline;padding:5px 10px 4px;border-bottom:1px solid var(--g)}
.inv .cli>div:last-child{border-bottom:0}
.inv .cli b{font-weight:700;font-size:13px;white-space:nowrap}
.inv .cli span{color:#16181b;flex:1;min-width:0;font-family:"Source Sans 3",Arial,sans-serif;font-size:13.5px}
.inv .tb{border:1.5px solid var(--g);border-radius:10px;overflow:hidden;margin-top:8px}
.inv table{min-width:0;width:100%;margin:0;border-collapse:collapse;table-layout:fixed}
.inv th{background:#fff;color:var(--g);font-size:13px;font-weight:700;letter-spacing:0;text-transform:uppercase;padding:5px 8px;border-bottom:1.5px solid var(--g);border-left:1.5px solid var(--g);text-align:center}
.inv td{height:27px;padding:3px 8px;border-bottom:1px solid var(--g);border-left:1.5px solid var(--g);color:#16181b;font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;vertical-align:middle}
.inv th:first-child,.inv td:first-child{border-left:0}
.inv tr:last-child td{border-bottom:0}
.iline{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
.iline .idesc{grid-column:1/-1}
.ival span{display:block;font-size:13px;font-weight:600;color:var(--muted)}.ival b{display:block;font-family:var(--font-mono);font-size:15px;padding:8px 0}
@media (max-width:520px){.iline{grid-template-columns:80px minmax(0,1fr)}.iline .ival{grid-column:1/2}}
.inv td.det{white-space:pre-line;height:auto;min-height:27px;line-height:1.3;padding:5px 8px}
.inv td.c{text-align:center}.inv td.r{text-align:right;font-variant-numeric:tabular-nums}
.inv .pie{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.inv .leg{border:1.5px solid var(--g);border-radius:8px;padding:6px 12px;font-family:Arial,sans-serif;font-size:11px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.inv .leg .rc{text-align:left;font-size:11.5px}
.inv .leg .rc u{display:inline-block;width:200px;border-bottom:1px solid var(--g);text-decoration:none}
.inv .tots{border:1.5px solid var(--g);border-radius:8px;overflow:hidden}
.inv .tots div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--g)}
.inv .tots div:last-child{border-bottom:0}
.inv .tots b{font-family:"Archivo Narrow",Impact,sans-serif;font-weight:700;font-size:19px;letter-spacing:.01em}
.inv .tots b::after{content:" ➤";font-size:15px}
.inv .tots span{color:#16181b;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px}
.inv .nota{margin-top:6px;font-size:11.5px;color:#16181b}
.inv .anul{position:relative}.inv .anul::after{content:"ANULADA";position:absolute;inset:40% 0 auto;text-align:center;font:700 72px Bungee,Impact,sans-serif;color:rgba(208,32,42,.28);transform:rotate(-18deg);pointer-events:none}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea .inv{min-width:0}:root{padding:0}body{background:#fff}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

<header><div class="wrap">
  <div class="top"><div class="brand"><img id="brandJeep" alt=""><span><small>Transporte</small>Carro Viejo</span></div><div class="mode" id="mode">Cargando datos…</div></div>
  <nav id="nav">
    <a href="#resumen">Resumen</a><a href="#viajes">Viajes</a><a href="#vehiculos">Vehículos</a><a href="#conductores">Conductores</a><a href="#clientes">Clientes</a><a href="#gastos">Gastos</a><a href="#facturas">Facturas</a>
  </nav>
</div></header>
<main class="wrap" id="main"></main>

<div id="printArea"></div>
<dialog id="inv" class="wide"><form id="invFrm" novalidate>
  <div class="dh"><h2 id="invTitle" style="margin:0">Facturar</h2></div>
  <div class="ib" id="invBody"></div>
  <div class="df" id="invFoot"></div>
</form></dialog>
<dialog id="dlg"><form id="frm" novalidate>
  <div class="dh"><h2 id="dlgTitle" style="margin:0">Nuevo</h2></div>

  <div class="df"><button type="button" class="danger left" id="delBtn" hidden>Eliminar</button><button type="button" id="cancelBtn">Cancelar</button><button type="submit" class="primary" id="saveBtn">Guardar</button></div>
</form></dialog>

<script>
const COLS=['vehiculos','conductores','clientes','viajes','gastos','facturas','config'];
const S={vehiculos:[],conductores:[],clientes:[],viajes:[],gastos:[],facturas:[],config:[]};
const loaded={};
let mode='loading', db=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const nf=new Intl.NumberFormat('es-CO');
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const THIS_MONTH=TODAY.slice(0,7);
const days=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5):null;
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const num=v=>Number(v)||0;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const ui={sel:new Set(),viajesMes:THIS_MONTH,gastosMes:THIS_MONTH,resumenMes:THIS_MONTH,viajesVeh:'',gastosVeh:''};

/* ---------- Esquemas de formularios ---------- */
const vehOpts=()=>S.vehiculos.map(v=>[v.id,v.placa+(v.marca?' · '+v.marca+' '+(v.modelo||''):'')]);
const condOpts=()=>S.conductores.map(c=>[c.id,c.nombre]);
const SCHEMA={
  config:{one:'datos de la empresa',fields:[
    {k:'nombre',l:'Nombre o razón social',req:1,full:1,def:()=>'Transporte Carro Viejo'},{k:'nit',l:'NIT o cédula',def:()=>'92.226463'},{k:'propietario',l:'Propietario',def:()=>'Fulbio Oyola'},{k:'telefono',l:'Celular'},
    {k:'direccion',l:'Dirección'},{k:'ciudad',l:'Ciudad',ph:'Caucasia, Antioquia'},{k:'correo',l:'Correo'},
    {k:'tipoDoc',l:'Tipo de documento',t:'select',o:['Factura de venta','Cuenta de cobro']},{k:'prefijo',l:'Prefijo del número'},
    {k:'inicio',l:'Primer número',t:'number',def:()=>144},{k:'pago',l:'Cuenta para pagos',ph:'Bancolombia ahorros 000-000000-00',full:1},
    {k:'pie',l:'Texto al pie',t:'textarea',full:1,ph:'No responsable de IVA.'}]},
  vehiculos:{one:'vehículo',fields:[
    {k:'placa',l:'Placa',req:1,ph:'ABC123'},{k:'ciudad',l:'Ciudad de matrícula',ph:'Medellín'},
    {k:'marca',l:'Marca',ph:'Renault'},{k:'modelo',l:'Línea / modelo',ph:'Duster'},
    {k:'anio',l:'Año',t:'number'},{k:'tipo',l:'Tipo',t:'select',o:['Automóvil','Camioneta','Campero','Van','Taxi']},
    {k:'km',l:'Kilometraje actual',t:'number'},{k:'estado',l:'Estado',t:'select',o:['Activo','En taller','Inactivo']},
    {k:'soat',l:'Vence SOAT',t:'date'},{k:'tecno',l:'Vence técnico-mecánica',t:'date'}]},
  conductores:{one:'conductor',fields:[
    {k:'nombre',l:'Nombre completo',req:1,full:1},{k:'cedula',l:'Cédula'},{k:'telefono',l:'Celular',ph:'300 000 0000'},
    {k:'categoria',l:'Categoría licencia',t:'select',o:['B1','B2','B3','C1','C2','C3']},{k:'licencia',l:'Vence licencia',t:'date'},

/* ---------- Almacenamiento ---------- */
function lsGet(c){try{return JSON.parse(localStorage.getItem('flota_'+c)||'[]')}catch(e){return []}}
function lsSet(c){try{localStorage.setItem('flota_'+c,JSON.stringify(S[c]))}catch(e){}}
async function initStore(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    mode='db';$('#mode').textContent='Datos guardados en la nube';
    COLS.forEach(c=>{
      const t=setTimeout(()=>{$('#mode').textContent='Sin conexión con los datos todavía'},10000);
      db.collection(c).onSnapshot(s=>{
        S[c]=s.docs.map(d=>({...d.data(),id:d.id}));
        if(!s.metadata.fromCache){clearTimeout(t);loaded[c]=true;$('#mode').textContent='Datos guardados en la nube'}
        render();
      },e=>{clearTimeout(t);loaded[c]=true;toast('No se pudieron cargar los '+c+'. Recarga la página.');render()});
    });
  }else{
    mode='local';COLS.forEach(c=>{S[c]=lsGet(c);loaded[c]=true});
    $('#mode').textContent='Guardado solo en este navegador';render();
  }
}
async function save(c,id,data){
  if(mode==='db'){
    if(id) await db.collection(c).doc(id).set(data); else await db.collection(c).add(data);
  }else{
    if(id){const i=S[c].findIndex(x=>x.id===id);if(i<0)S[c].push({...data,id});else S[c][i]={...data,id}}else S[c].push({...data,id:uid()});
    lsSet(c);render();
  }
}
async function remove(c,id){
  if(mode==='db') await db.collection(c).doc(id).delete();
  else{S[c]=S[c].filter(x=>x.id!==id);lsSet(c);render()}
}

/* ---------- Utilidades de vista ---------- */
const veh=id=>S.vehiculos.find(v=>v.id===id);
const cond=id=>S.conductores.find(c=>c.id===id);
function placa(v){if(!v)return'<span class="muted">—</span>';const p=String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const f=p.length===6?p.slice(0,3)+' '+p.slice(3):p;return`<span class="placa">${esc(f)}${v.ciudad?`<small>${esc(v.ciudad)}</small>`:''}</span>`}
function venc(d){const n=days(d);if(n===null)return'<span class="pill mu">Sin fecha</span>';if(n<0)return`<span class="pill bad">Vencido ${fdate(d)}</span>`;if(n<=30)return`<span class="pill warn">${n===0?'Vence hoy':'En '+n+' días'}</span>`;return`<span class="pill ok">${fdate(d)}</span>`}
const estadoCls={Activo:'ok','En taller':'warn',Inactivo:'mu',Programado:'mu','En curso':'warn',Completado:'ok',Cancelado:'bad'};
const pill=e=>e?`<span class="pill ${estadoCls[e]||'mu'}">${esc(e)}</span>`:'';
const isLoading=()=>COLS.some(c=>!loaded[c]);
function emptyRow(cols,title,txt){return`<tr><td colspan="${cols}"><div class="empty"><b>${isLoading()?'Cargando…':title}</b>${isLoading()?'':txt}</div></td></tr>`}
const vehSelect=(id,val)=>`<label>Vehículo<select id="${id}"><option value="">Todos</option>${S.vehiculos.map(v=>`<option value="${v.id}"${v.id===val?' selected':''}>${esc(v.placa)}</option>`).join('')}</select></label>`;

  </div>
  <div class="cols">
   <section class="panel"><h2>Documentos por vencer</h2>${alerts.length?`<ul class="alerts">${alerts.map(a=>`<li class="${a.n<0?'bad':''}">${a.html}</li>`).join('')}</ul>`:`<div class="empty"><b>${isLoading()?'Cargando…':'Todo al día'}</b>${isLoading()?'':'Ningún SOAT, técnico-mecánica o licencia vence en los próximos 30 días.'}</div>`}</section>
   <section class="panel"><h2>Ingresos y gastos por vehículo</h2>${per.length?`<div class="legend"><span><i style="background:var(--ok)"></i>Ingresos</span><span><i style="background:var(--bad);opacity:.75"></i>Gastos</span></div><div class="bars">${per.map(r=>`<div class="brow">${placa(r.v)}<div class="btrack"><div class="b in" style="width:${r.i/mx*100}%"></div><div class="bnum">${cop.format(r.i)}</div><div class="b out" style="width:${r.g/mx*100}%"></div><div class="bnum">${cop.format(r.g)}</div></div></div>`).join('')}</div>`:`<div class="empty"><b>${isLoading()?'Cargando…':'Sin movimientos este mes'}</b>${isLoading()?'':'Registra viajes y gastos para ver la comparación.'}</div>`}</section>

const VIEWS={resumen:vResumen,viajes:vViajes,vehiculos:vVehiculos,conductores:vConductores,clientes:vClientes,gastos:vGastos,facturas:vFacturas};

}

  const b=e.target.closest('button');if(!b)return;

const dlg=$('#dlg');let cur=null,delArmed=false;
function field(f,val){
  const id='f_'+f.k, req=f.req?' required':'', cls=f.full?' class="full"':'';
  let inp;
  if(f.t==='select'){
    const opts=f.opts?f.opts():f.o.map(o=>[o,o]);
    inp=`<select id="${id}" name="${f.k}"${req}>${f.blank||f.opts?`<option value="">${esc(f.blank||'Selecciona…')}</option>`:''}${opts.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  }else if(f.t==='textarea') inp=`<textarea id="${id}" name="${f.k}" rows="2">${esc(val)}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}"${f.t==='number'?` inputmode="decimal" step="${f.step||'any'}" min="0"`:''} value="${esc(val)}" placeholder="${esc(f.ph||'')}"${f.list?` list="${f.list}" autocomplete="off"`:''}${req}>${f.list?cliDatalist(f.list):''}`;
  return`<label${cls} for="${id}">${esc(f.l)}${f.req?' *':''}${inp}</label>`;
}
function openForm(c,id){
  const sc=SCHEMA[c], rec=id?S[c].find(x=>x.id===id):null;
  if((c==='viajes'||c==='gastos')&&!S.vehiculos.length){toast('Primero registra al menos un vehículo.');location.hash='vehiculos';return}
  cur={c,id};delArmed=false;
  $('#dlgTitle').textContent=c==='config'?'Datos de la empresa':(rec?'Editar ':'Nuevo ')+sc.one;
  $('#dlgBody').innerHTML=sc.fields.map(f=>field(f,rec?rec[f.k]:(f.def?f.def():(f.t==='select'&&f.o?f.o[0]:'')))).join('');
  if(c==='viajes'&&!rec&&ui.viajesVeh)$('#f_vehiculo').value=ui.viajesVeh;
  $('#delBtn').hidden=!rec||c==='config';$('#delBtn').textContent='Eliminar';
  dlg.showModal();
}

$('#cancelBtn').onclick=()=>dlg.close();
$('#delBtn').onclick=async()=>{
  if(!delArmed){delArmed=true;$('#delBtn').textContent='¿Seguro? Toca otra vez';return}
  try{await remove(cur.c,cur.id);dlg.close();toast('Eliminado')}catch(e){toast(errMsg(e))}
};
$('#frm').addEventListener('submit',async e=>{
  e.preventDefault();
  const sc=SCHEMA[cur.c], data={};
  for(const f of sc.fields){
    let v=$('#f_'+f.k).value.trim();
    if(f.req&&!v){$('#f_'+f.k).focus();toast('Completa: '+f.l);return}
    if(f.t==='number')v=v===''?null:Number(v);
    if(f.k==='placa')v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');
    data[f.k]=v;
  }
  if(cur.c==='vehiculos'&&S.vehiculos.some(v=>v.placa===data.placa&&v.id!==cur.id)){toast('Ya existe un vehículo con la placa '+data.placa);return}
  $('#saveBtn').disabled=true;
  try{await save(cur.c,cur.id,data);dlg.close();toast('Guardado')}catch(err){toast(errMsg(err))}
  finally{$('#saveBtn').disabled=false}
});
function errMsg(e){if(e&&e.code==='invalid_argument')return'No tienes permiso para editar estos datos.';if(e&&e.code==='quota_exceeded')return'Se llenó el espacio de datos. Elimina registros viejos.';return'No se pudo guardar. Intenta de nuevo.'}

function letras(n){
  n=Math.floor(Math.abs(n));if(n===0)return'cero pesos';if(n===1)return'un peso';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const H=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const ap=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const d2=n=>n<30?U[n]:T[Math.floor(n/10)]+(n%10?' y '+U[n%10]:'');
  const d3=n=>n===100?'cien':[H[Math.floor(n/100)],n%100?d2(n%100):''].filter(Boolean).join(' ');
  const d6=n=>{const t=Math.floor(n/1000),r=n%1000;return[t===0?'':t===1?'mil':ap(d3(t))+' mil',r?d3(r):''].filter(Boolean).join(' ')};
  const m=Math.floor(n/1e6),r=n%1e6;
  let s=[m===0?'':m===1?'un millón':ap(d6(m))+' millones',r?d6(r):''].filter(Boolean).join(' ');
  s=ap(s);return s+(r===0?' de pesos':' pesos');
}

function invoiceHTML(f){
  const e={...EMP_DEF,...(f.empresa||empresa())};
  const [y,m,d]=(f.fecha||'').split('-');
  const items=f.items||[];
  const filas=items.map(i=>{const c=i.cant==null?1:num(i.cant),u=i.unit==null?num(i.valor):num(i.unit);return`<tr><td class="c">${nf.format(c)}</td><td class="det">${esc(i.desc)}</td><td class="r">${cop.format(u)}</td><td class="r">${cop.format(num(i.valor))}</td></tr>`});
  for(let k=items.length;k<14;k++)filas.push('<tr><td></td><td></td><td></td><td></td></tr>');
  const nom=String(e.nombre||'Transporte Carro Viejo').replace(/^transporte\s+/i,'');
  return`<div class="inv${f.estado==='Anulada'?' anul':''}">
  <div class="ih">
   <img class="jeep" src="${JEEP}" alt="">
   <div class="marca"><div class="tr">TRANSPORTE</div><div style="width:100%"><div class="ban">${esc(nom)}</div><div class="chk"></div><div class="chk b"></div></div>
    <div class="nit">Nit. ${esc(e.nit||'')}<br>${esc(e.propietario||'')}</div></div>
   <div class="der"><div class="fbox"><small>${esc(String(f.tipoDoc||e.tipoDoc||'Factura de venta').toUpperCase())}</small><div class="no"><i>Nº</i>${esc(numFact(f))}</div></div>
    <div class="fecha"><div><small>Día</small><b>${d||'&nbsp;'}</b></div><div><small>Mes</small><b>${m||'&nbsp;'}</b></div><div><small>Año</small><b>${y||'&nbsp;'}</b></div></div>
    <div class="slogan">Servicio de<br>Transporte y Encomienda</div></div>
  </div>
  <div class="cli"><div><b>Cliente:</b><span>${esc(f.cliente)}</span></div>
   <div><b>C.C. ó NIT:</b><span>${esc(f.clienteId||'')}</span><b>TEL:</b><span>${esc(f.clienteTel||'')}</span></div>
   <div><b>DIRECCIÓN:</b><span>${esc(f.clienteDir||'')}</span></div></div>
  <div class="tb"><table><colgroup><col style="width:11%"><col><col style="width:19%"><col style="width:21%"></colgroup>
   <thead><tr><th>Cant.</th><th>Detalle</th><th>Vr. Unit.</th><th>Valor Total</th></tr></thead><tbody>${filas.join('')}</tbody></table></div>
  <div class="pie"><div class="leg"><div>La presente Factura de Venta se asimila para todos sus efectos a una letra de Cambio. (Art. 774 de la Cámara de Comercio).</div>
    <div class="rc">Recibí Conforme <u></u><br><span style="margin-left:52px">C.C.</span></div></div>
   <div class="tots"><div><b>SUB-TOTAL</b><span>${cop.format(num(f.total))}</span></div><div><b>TOTAL</b><span>${cop.format(num(f.total))}</span></div></div></div>
  ${f.notas?`<div class="nota">Nota: ${esc(f.notas)}</div>`:''}
  </div>`;
}
const invDlg=$('#inv');let invCur=null;
const normName=t=>String(t||'').trim().toLowerCase().replace(/\s+/g,' ');
const cliByName=n=>S.clientes.find(c=>normName(c.nombre)===normName(n));
function cliDatalist(id){return`<datalist id="${id}">${S.clientes.map(c=>`<option value="${esc(c.nombre)}">${esc(c.documento||'')}</option>`).join('')}</datalist>`}
function openFacturar(ids,cliId){
  const vs=ids.map(id=>S.viajes.find(v=>v.id===id)).filter(v=>v&&!factOf(v)&&v.estado!=='Cancelado').sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(ids.length&&!vs.length){toast('Esos viajes ya están facturados.');return}
  const items=vs.map(v=>{const vh=veh(v.vehiculo);return{viajeId:v.id,fecha:v.fecha,desc:[[`Servicio de transporte ${v.origen||''} → ${v.destino||''}`,fdate(v.fecha),vh&&vh.placa?'Placa '+vh.placa:''].filter(Boolean).join(' · '),String(v.notas||'').trim()].filter(Boolean).join('\n'),placa:vh?vh.placa:'',km:v.km||null,cant:1,unit:num(v.valor),valor:num(v.valor)}});
  if(!items.length)items.push({desc:'',cant:1,unit:0,valor:0});
  const e=empresa();
  const c=cliId?S.clientes.find(x=>x.id===cliId):cliByName(vs[0]?.cliente);
  invCur={draft:{numero:nextNum(),prefijo:e.prefijo||'',tipoDoc:e.tipoDoc||'Factura de venta',fecha:TODAY,cliente:c?c.nombre:(vs[0]?.cliente||''),clienteRef:c?c.id:'',clienteId:c?.documento||'',clienteDir:[c?.direccion,c?.ciudad].filter(Boolean).join(', '),clienteTel:c?.telefono||'',notas:'',items,total:0,estado:'Pendiente'}};
  $('#invTitle').textContent=vs.length?'Facturar '+vs.length+' viaje'+(vs.length>1?'s':''):'Nueva factura';
  const d=invCur.draft;
  $('#invBody').innerHTML=`<div class="igrid">
   <label for="i_cliente">Cliente *<input id="i_cliente" list="iCliList" autocomplete="off" placeholder="Escribe o elige un cliente" value="${esc(d.cliente)}">${cliDatalist('iCliList')}</label>
   <label for="i_clienteId">C.C. ó NIT<input id="i_clienteId" value="${esc(d.clienteId)}"></label>
   <label for="i_clienteTel">Teléfono<input id="i_clienteTel" value="${esc(d.clienteTel)}"></label>
   <label for="i_clienteDir">Dirección<input id="i_clienteDir" value="${esc(d.clienteDir)}"></label>
   <label for="i_fecha">Fecha<input id="i_fecha" type="date" value="${d.fecha}"></label>
   <label for="i_numero">Número<input id="i_numero" type="number" min="1" value="${d.numero}"></label>
   <label for="i_notas" style="grid-column:1/-1">Nota (opcional)<input id="i_notas" placeholder="Ej.: pago a 15 días"></label></div>
   <div><h2 style="margin:4px 0 8px">Detalle de la factura</h2><div id="iLines"></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px"><button type="button" data-addline="1">+ Agregar línea</button><b id="iTotal" style="font-family:var(--font-mono)"></b></div></div>
   <div class="paper" id="invPrev"></div>`;
  $('#invFoot').innerHTML=`<button type="button" class="left" data-empresa2="1">Datos de la empresa</button><button type="button" data-cerrar="1">Cancelar</button><button type="submit" class="primary">Guardar factura</button>`;
  drawLines();prev();invDlg.showModal();
}
function drawLines(){
  const d=invCur.draft;
  $('#iLines').innerHTML=d.items.map((it,k)=>`<div class="iline">
   <label for="i_cant_${k}">Cant.<input id="i_cant_${k}" type="number" inputmode="decimal" min="0" step="any" value="${esc(it.cant)}"></label>
   <label for="i_unit_${k}">Vr. unitario<input id="i_unit_${k}" type="number" inputmode="decimal" min="0" step="any" value="${esc(it.unit)}"></label>
   <div class="ival"><span>Valor total</span><b id="i_val_${k}">${cop.format(num(it.valor))}</b></div>
   ${d.items.length>1?`<button type="button" class="link" data-delline="${k}">Quitar</button>`:'<span></span>'}
   <label for="i_desc_${k}" class="idesc">Detalle (así sale en la factura)<textarea id="i_desc_${k}" rows="2">${esc(it.desc)}</textarea></label></div>`).join('');
}
function readDraft(){
  const d=invCur.draft;['cliente','clienteId','clienteTel','clienteDir','fecha','notas'].forEach(k=>d[k]=$('#i_'+k).value.trim());
  d.items.forEach((it,k)=>{const t=$('#i_desc_'+k);if(!t)return;it.desc=t.value.trim();it.cant=num($('#i_cant_'+k).value);it.unit=num($('#i_unit_'+k).value);it.valor=Math.round(it.cant*it.unit);const o=$('#i_val_'+k);if(o)o.textContent=cop.format(it.valor)});
  d.total=d.items.reduce((a,i)=>a+num(i.valor),0);if($('#iTotal'))$('#iTotal').textContent='Total '+cop.format(d.total);
  const c=cliByName(d.cliente);d.clienteRef=c?c.id:'';
  d.numero=num($('#i_numero').value)||d.numero;return d}
// Al elegir un cliente registrado, llena sus datos
$('#invBody').addEventListener('change',e=>{
  if(e.target.id!=='i_cliente')return;const c=cliByName(e.target.value);if(!c)return;
  $('#i_clienteId').value=c.documento||'';$('#i_clienteTel').value=c.telefono||'';$('#i_clienteDir').value=[c.direccion,c.ciudad].filter(Boolean).join(', ');prev();
});
$('#invBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!invCur?.draft)return;
  if(b.dataset.addline){readDraft();invCur.draft.items.push({desc:'',cant:1,unit:0,valor:0});drawLines();prev();$('#i_desc_'+(invCur.draft.items.length-1)).focus()}
  if(b.dataset.delline){readDraft();invCur.draft.items.splice(num(b.dataset.delline),1);drawLines();prev()}
});
function prev(){if(invCur&&invCur.draft&&$('#invPrev'))$('#invPrev').innerHTML=invoiceHTML({...readDraft(),empresa:empresa()})}
$('#invBody').addEventListener('input',prev);
$('#invFrm').addEventListener('submit',async e=>{
  e.preventDefault();if(!invCur||!invCur.draft)return;
  const d=readDraft();
  if(!d.cliente){$('#i_cliente').focus();toast('Escribe el nombre del cliente.');return}
  d.items=d.items.filter(i=>i.desc||i.valor||i.viajeId);
  if(!d.items.length){toast('Agrega al menos una línea con detalle.');drawLines();return}
  d.total=d.items.reduce((a,i)=>a+num(i.valor),0);
  try{const c=cliByName(d.cliente);const dat={nombre:d.cliente,documento:d.clienteId,telefono:d.clienteTel,direccion:d.clienteDir};
    if(!c){const cid=uid();await save('clientes',cid,{...dat,ciudad:'',correo:'',notas:''});d.clienteRef=cid}
    else{d.clienteRef=c.id;const{id:cid,...cd}=c;const upd={...cd};let ch=false;for(const k of ['documento','telefono','direccion'])if(!cd[k]&&dat[k]){upd[k]=dat[k];ch=true}if(ch)await save('clientes',cid,upd)}
  }catch(err){}
  if(S.facturas.some(f=>num(f.numero)===d.numero&&(f.prefijo||'')===d.prefijo)){toast('Ya existe la factura número '+d.numero+'.');return}
  const id=uid();const{id:_e,...emp}=empresa();const rec={...d,empresa:emp};
  try{
    await save('facturas',id,rec);
    for(const it of d.items){const v=S.viajes.find(x=>x.id===it.viajeId);if(v){const{id:vid,...vd}=v;await save('viajes',vid,{...vd,factura:id,cliente:vd.cliente||d.cliente})}}
    d.items.forEach(i=>ui.sel.delete(i.viajeId));
    toast('Factura '+numFact(d)+' guardada · generando PDF…');showFactura({...rec,id});render();
    archivarPdf({...rec,id});
  }catch(err){toast(errMsg(err))}
});

/* ---------- PDF: generar y guardar en el archivo ---------- */
const pdfName=f=>`${(f.tipoDoc||'Factura').replace(/\s+/g,'-')}-${numFact(f)}.pdf`;
let pdfLib=null;
function loadPdfLib(){
  if(window.html2pdf)return Promise.resolve(window.html2pdf);
  if(!pdfLib)pdfLib=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=()=>ok(window.html2pdf);s.onerror=()=>{pdfLib=null;ko(new Error('pdf'))};document.head.appendChild(s)});
  return pdfLib;
}
async function makePdf(f){
  const h2p=await loadPdfLib();
  try{await document.fonts.ready}catch(e){}
  const st=document.createElement('div');st.id='pdfStage';st.innerHTML=invoiceHTML(f);document.body.appendChild(st);
  try{
    return await h2p().set({margin:[12,12,12,12],filename:pdfName(f),image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(st.firstElementChild).outputPdf('blob');
  }finally{st.remove()}
}
let assetsCap;
async function getAssets(){if(assetsCap===undefined){try{assetsCap=window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){assetsCap=null}}return assetsCap}
// Genera el PDF de la factura y lo guarda en el archivo de la app (queda enlazado a la factura).
async function archivarPdf(f){
  let blob;
  try{blob=await makePdf(f)}catch(e){toast('No se pudo generar el PDF. Revisa tu conexión.');return false}
  const as=await getAssets();
  if(!as||mode!=='db'){toast('PDF generado. Para guardarlo en el archivo abre la app desde tu cuenta de Claude.');return false}
  try{
    const r=await as.upload(new File([blob],pdfName(f),{type:'application/pdf'}));
    const cur=S.facturas.find(x=>x.id===f.id)||f;const{id,...d}=cur;
    await save('facturas',id,{...d,pdfId:r.id,pdfUrl:r.url,pdfAt:new Date().toISOString()});
    toast('PDF '+pdfName(f)+' guardado en el archivo');
    if(invDlg.open&&invCur&&invCur.view&&invCur.view.id===id)showFactura({...d,id,pdfId:r.id,pdfUrl:r.url});
    return true;
  }catch(e){toast('No se pudo guardar el PDF en el archivo.');return false}
}
async function pdfBlob(f){
  if(f.pdfUrl){try{const r=await fetch(f.pdfUrl);if(r.ok)return await r.blob()}catch(e){}}
  return makePdf(f);
}
function verFactura(id){const f=S.facturas.find(x=>x.id===id);if(f)showFactura(f)}
let dlCap;
async function showFactura(f){
  invCur={view:f};
  $('#invTitle').textContent=(f.tipoDoc||'Factura')+' '+numFact(f);
  $('#invBody').innerHTML=`<div class="paper">${invoiceHTML(f)}</div>`;
  if(dlCap===undefined){try{dlCap=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dlCap=null}}
  const inClaude=mode==='db';
  $('#invFoot').innerHTML=`${f.estado!=='Anulada'?`<button type="button" class="danger left" data-anular="1">Anular</button>`:''}<button type="button" data-cerrar="1">Cerrar</button>${!inClaude?`<button type="button" data-imprimir="1">Imprimir</button>`:''}${f.pdfUrl?`<a class="btn" href="${esc(f.pdfUrl)}" target="_blank" rel="noopener">Abrir PDF</a>`:inClaude?`<button type="button" data-archivar="1">Guardar PDF en archivo</button>`:''}${dlCap?`<button type="button" class="primary" data-descargar="1">Descargar PDF</button>`:''}`;
  if(!invDlg.open)invDlg.showModal();
}
let anularArmed=false;
$('#invFoot').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cerrar){invDlg.close();invCur=null}
  if(b.dataset.empresa2){invDlg.close();openForm('config','empresa')}
  if(b.dataset.imprimir){$('#printArea').innerHTML=invoiceHTML(invCur.view);window.print()}
  if(b.dataset.archivar){b.disabled=true;b.textContent='Generando…';if(!await archivarPdf(invCur.view)){b.disabled=false;b.textContent='Guardar PDF en archivo'}}
  if(b.dataset.descargar){
    const f=invCur.view;b.disabled=true;const t=b.textContent;b.textContent='Preparando PDF…';
    try{const blob=await pdfBlob(f);await dlCap.save({filename:pdfName(f),data:blob});toast('PDF descargado')}
    catch(err){if(!(err&&err.code==='declined'))toast(err&&err.code?'No se pudo descargar el PDF.':'No se pudo generar el PDF. Revisa tu conexión.')}
    finally{b.disabled=false;b.textContent=t}
  }
  if(b.dataset.anular){
    if(!anularArmed){anularArmed=true;b.textContent='¿Anular? Toca otra vez';setTimeout(()=>{anularArmed=false},4000);return}
    anularArmed=false;const f=invCur.view;const{id,...d}=f;
    try{await save('facturas',id,{...d,estado:'Anulada'});
      for(const it of f.items||[]){const v=S.viajes.find(x=>x.id===it.viajeId);if(v&&v.factura===id){const{id:vid,factura,...vd}=v;await save('viajes',vid,vd)}}
      invDlg.close();toast('Factura anulada; los viajes quedan libres para facturar de nuevo')}catch(err){toast(errMsg(err))}
  }
});
estadoCls.Pendiente='warn';estadoCls.Pagada='ok';estadoCls.Anulada='bad';

$('#brandJeep').src=JEEP;
render();initStore();
</script>
