<title>Transporte Carro Viejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior con pestañas tipo señal vial; cada pestaña es una tabla operativa con su formulario en un diálogo. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15191e; --muted:#5d6570; --line:#d5d9de; --soft:#e4e7eb;
  --plate:#f2c400; --plate-ink:#111111;
  --ok:#1d7f47; --warn:#a8670f; --bad:#c22f2f;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 0}
.brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:26px;height:26px;background:var(--plate);border:2px solid var(--plate-ink);border-radius:4px;transform:rotate(45deg) scale(.8)}
.mode{font-size:13px;color:var(--muted);margin-left:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav a{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--plate)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
main{padding-block:20px 48px}
.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.sub{color:var(--muted);margin:2px 0 0}
.grow{flex:1;min-width:0}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
button,.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:600}
button.link:hover{color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{width:auto;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi b.neg{color:var(--bad)} .kpi b.pos{color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px}
td.act{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.placa{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:4px;padding:1px 8px 0;font-family:var(--font-mono);font-weight:700;font-size:14px;letter-spacing:.06em;line-height:1.2;white-space:nowrap}
.placa small{font-family:var(--font-body);font-size:8px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;line-height:1.1;padding-bottom:1px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mu{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--soft);border-left:4px solid var(--warn)}
.alerts li.bad{border-left-color:var(--bad)}
.alerts li div{flex:1;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.btrack{display:flex;flex-direction:column;gap:3px}
.b{height:10px;border-radius:2px;min-width:2px}
.b.in{background:var(--ok)} .b.out{background:var(--bad);opacity:.75}
.bnum{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,12,15,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line)}
.db{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto}
.db .full{grid-column:1/-1}
@media (max-width:480px){.db{grid-template-columns:1fr}}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df .left{margin-right:auto}
td.chk,th.chk{width:34px;padding-right:0}
td.chk input{width:18px;height:18px;accent-color:var(--ink)}
.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.selbar button{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.selbar .link{color:var(--bg);background:none;border:0}
.factno{font-family:var(--font-mono);font-size:12px;font-weight:700}
.pdflink{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.pdflink::before{content:"PDF";font-family:var(--font-body);font-size:10px;letter-spacing:.06em;background:var(--bad);color:#fff;border-radius:3px;padding:1px 4px;margin-right:6px}
#pdfStage{position:fixed;left:-10000px;top:0;width:780px;background:#fff}
#pdfStage .inv{min-width:0}
dialog.wide{width:min(860px,calc(100vw - 32px))}
.ib{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.paper{background:#ffffff;color:#16181b;border:1px solid var(--line);border-radius:6px;padding:28px;overflow-x:auto}
.inv{font-family:var(--font-body);font-size:13px;line-height:1.4;color:#16181b;min-width:560px}
.inv .ih{display:flex;justify-content:space-between;gap:24px;border-bottom:3px solid #16181b;padding-bottom:14px}
.inv .emp{font-family:var(--font-display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.inv .doc{text-align:right}
.inv .doc b{display:block;font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.inv .doc .no{font-family:var(--font-mono);font-size:20px;font-weight:700;background:#f2c400;border:2px solid #111;border-radius:4px;padding:0 8px;display:inline-block;margin:4px 0}
.inv .cli{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding:14px 0;border-bottom:1px solid #c9ccd1}
.inv .lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5d6570}
.inv table{min-width:0;margin-top:14px}
.inv th{background:#eef0f2;color:#5d6570}
.inv th,.inv td{border-bottom:1px solid #d5d9de;padding:7px 8px}
.inv .tot td{border-bottom:0;font-weight:700;font-size:15px}
.inv .let{margin-top:10px;padding:10px 12px;background:#eef0f2;border-radius:4px}
.inv .pie{margin-top:28px;display:flex;justify-content:space-between;gap:24px;align-items:end}
.inv .firma{border-top:1px solid #16181b;padding-top:6px;min-width:220px;text-align:center}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea .inv{min-width:0}:root{padding:0}body{background:#fff}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

<header><div class="wrap">
  <div class="top"><div class="brand"><i aria-hidden="true"></i>Transporte Carro Viejo</div><div class="mode" id="mode">Cargando datos…</div></div>
  <nav id="nav">
    <a href="#resumen">Resumen</a><a href="#viajes">Viajes</a><a href="#vehiculos">Vehículos</a><a href="#conductores">Conductores</a><a href="#gastos">Gastos</a><a href="#facturas">Facturas</a>
  </nav>
</div></header>
<main class="wrap" id="main"></main>

<div id="printArea"></div>
<dialog id="inv" class="wide"><form id="invFrm" novalidate>
  <div class="dh"><h2 id="invTitle" style="margin:0">Facturar</h2></div>
  <div class="ib" id="invBody"></div>
  <div class="df" id="invFoot"></div>
</form></dialog>
<dialog id="dlg"><form id="frm" novalidate>
  <div class="dh"><h2 id="dlgTitle" style="margin:0">Nuevo</h2></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button type="button" class="danger left" id="delBtn" hidden>Eliminar</button><button type="button" id="cancelBtn">Cancelar</button><button type="submit" class="primary" id="saveBtn">Guardar</button></div>
</form></dialog>

<script>
const COLS=['vehiculos','conductores','viajes','gastos','facturas','config'];
const S={vehiculos:[],conductores:[],viajes:[],gastos:[],facturas:[],config:[]};
const loaded={};
let mode='loading', db=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const nf=new Intl.NumberFormat('es-CO');
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const THIS_MONTH=TODAY.slice(0,7);
const days=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5):null;
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const num=v=>Number(v)||0;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const ui={sel:new Set(),viajesMes:THIS_MONTH,gastosMes:THIS_MONTH,resumenMes:THIS_MONTH,viajesVeh:'',gastosVeh:''};

/* ---------- Esquemas de formularios ---------- */
const vehOpts=()=>S.vehiculos.map(v=>[v.id,v.placa+(v.marca?' · '+v.marca+' '+(v.modelo||''):'')]);
const condOpts=()=>S.conductores.map(c=>[c.id,c.nombre]);
const SCHEMA={
  config:{one:'datos de la empresa',fields:[
    {k:'nombre',l:'Nombre o razón social',req:1,full:1,def:()=>'Transporte Carro Viejo'},{k:'nit',l:'NIT o cédula'},{k:'telefono',l:'Celular'},
    {k:'direccion',l:'Dirección'},{k:'ciudad',l:'Ciudad',ph:'Caucasia, Antioquia'},{k:'correo',l:'Correo'},
    {k:'tipoDoc',l:'Tipo de documento',t:'select',o:['Cuenta de cobro','Factura de venta']},{k:'prefijo',l:'Prefijo del número',ph:'CC-'},
    {k:'inicio',l:'Primer número',t:'number',def:()=>1},{k:'pago',l:'Cuenta para pagos',ph:'Bancolombia ahorros 000-000000-00',full:1},
    {k:'pie',l:'Texto al pie',t:'textarea',full:1,ph:'No responsable de IVA.'}]},
  vehiculos:{one:'vehículo',fields:[
    {k:'placa',l:'Placa',req:1,ph:'ABC123'},{k:'ciudad',l:'Ciudad de matrícula',ph:'Medellín'},
    {k:'marca',l:'Marca',ph:'Renault'},{k:'modelo',l:'Línea / modelo',ph:'Duster'},
    {k:'anio',l:'Año',t:'number'},{k:'tipo',l:'Tipo',t:'select',o:['Automóvil','Camioneta','Campero','Van','Taxi']},
    {k:'km',l:'Kilometraje actual',t:'number'},{k:'estado',l:'Estado',t:'select',o:['Activo','En taller','Inactivo']},
    {k:'soat',l:'Vence SOAT',t:'date'},{k:'tecno',l:'Vence técnico-mecánica',t:'date'}]},
  conductores:{one:'conductor',fields:[
    {k:'nombre',l:'Nombre completo',req:1,full:1},{k:'cedula',l:'Cédula'},{k:'telefono',l:'Celular',ph:'300 000 0000'},
    {k:'categoria',l:'Categoría licencia',t:'select',o:['B1','B2','B3','C1','C2','C3']},{k:'licencia',l:'Vence licencia',t:'date'},
    {k:'vehiculo',l:'Vehículo asignado',t:'select',opts:vehOpts,blank:'Sin asignar',full:1}]},
  viajes:{one:'viaje',fields:[
    {k:'fecha',l:'Fecha',t:'date',req:1,def:()=>TODAY},{k:'estado',l:'Estado',t:'select',o:['Programado','En curso','Completado','Cancelado']},
    {k:'vehiculo',l:'Vehículo',t:'select',opts:vehOpts,req:1},{k:'conductor',l:'Conductor',t:'select',opts:condOpts,blank:'—'},
    {k:'origen',l:'Origen',req:1},{k:'destino',l:'Destino',req:1},
    {k:'cliente',l:'Cliente / pasajero'},{k:'km',l:'Km recorridos',t:'number'},
    {k:'valor',l:'Valor cobrado (COP)',t:'number',full:1},{k:'notas',l:'Notas',t:'textarea',full:1}]},
  gastos:{one:'gasto',fields:[
    {k:'fecha',l:'Fecha',t:'date',req:1,def:()=>TODAY},{k:'tipo',l:'Tipo',t:'select',o:['Combustible','Mantenimiento','Peaje','Parqueadero','Lavado','Llantas','Seguro','Otro']},
    {k:'vehiculo',l:'Vehículo',t:'select',opts:vehOpts,req:1},{k:'valor',l:'Valor (COP)',t:'number',req:1},
    {k:'galones',l:'Galones (si es combustible)',t:'number',step:'0.01'},{k:'km',l:'Kilometraje al momento',t:'number'},
    {k:'detalle',l:'Detalle',t:'textarea',full:1}]}
};

/* ---------- Almacenamiento ---------- */
function lsGet(c){try{return JSON.parse(localStorage.getItem('flota_'+c)||'[]')}catch(e){return []}}
function lsSet(c){try{localStorage.setItem('flota_'+c,JSON.stringify(S[c]))}catch(e){}}
async function initStore(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    mode='db';$('#mode').textContent='Datos guardados en la nube';
    COLS.forEach(c=>{
      const t=setTimeout(()=>{$('#mode').textContent='Sin conexión con los datos todavía'},10000);
      db.collection(c).onSnapshot(s=>{
        S[c]=s.docs.map(d=>({...d.data(),id:d.id}));
        if(!s.metadata.fromCache){clearTimeout(t);loaded[c]=true;$('#mode').textContent='Datos guardados en la nube'}
        render();
      },e=>{clearTimeout(t);loaded[c]=true;toast('No se pudieron cargar los '+c+'. Recarga la página.');render()});
    });
  }else{
    mode='local';COLS.forEach(c=>{S[c]=lsGet(c);loaded[c]=true});
    $('#mode').textContent='Guardado solo en este navegador';render();
  }
}
async function save(c,id,data){
  if(mode==='db'){
    if(id) await db.collection(c).doc(id).set(data); else await db.collection(c).add(data);
  }else{
    if(id){const i=S[c].findIndex(x=>x.id===id);if(i<0)S[c].push({...data,id});else S[c][i]={...data,id}}else S[c].push({...data,id:uid()});
    lsSet(c);render();
  }
}
async function remove(c,id){
  if(mode==='db') await db.collection(c).doc(id).delete();
  else{S[c]=S[c].filter(x=>x.id!==id);lsSet(c);render()}
}

/* ---------- Utilidades de vista ---------- */
const veh=id=>S.vehiculos.find(v=>v.id===id);
const cond=id=>S.conductores.find(c=>c.id===id);
function placa(v){if(!v)return'<span class="muted">—</span>';const p=String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const f=p.length===6?p.slice(0,3)+' '+p.slice(3):p;return`<span class="placa">${esc(f)}${v.ciudad?`<small>${esc(v.ciudad)}</small>`:''}</span>`}
function venc(d){const n=days(d);if(n===null)return'<span class="pill mu">Sin fecha</span>';if(n<0)return`<span class="pill bad">Vencido ${fdate(d)}</span>`;if(n<=30)return`<span class="pill warn">${n===0?'Vence hoy':'En '+n+' días'}</span>`;return`<span class="pill ok">${fdate(d)}</span>`}
const estadoCls={Activo:'ok','En taller':'warn',Inactivo:'mu',Programado:'mu','En curso':'warn',Completado:'ok',Cancelado:'bad'};
const pill=e=>e?`<span class="pill ${estadoCls[e]||'mu'}">${esc(e)}</span>`:'';
const isLoading=()=>COLS.some(c=>!loaded[c]);
function emptyRow(cols,title,txt){return`<tr><td colspan="${cols}"><div class="empty"><b>${isLoading()?'Cargando…':title}</b>${isLoading()?'':txt}</div></td></tr>`}
const vehSelect=(id,val)=>`<label>Vehículo<select id="${id}"><option value="">Todos</option>${S.vehiculos.map(v=>`<option value="${v.id}"${v.id===val?' selected':''}>${esc(v.placa)}</option>`).join('')}</select></label>`;

/* ---------- Vistas ---------- */
function vResumen(){
  const m=ui.resumenMes;
  const vj=S.viajes.filter(x=>(x.fecha||'').startsWith(m)&&x.estado!=='Cancelado');
  const gs=S.gastos.filter(x=>(x.fecha||'').startsWith(m));
  const ing=vj.reduce((a,x)=>a+num(x.valor),0), gas=gs.reduce((a,x)=>a+num(x.valor),0), km=vj.reduce((a,x)=>a+num(x.km),0);
  const comb=gs.filter(g=>g.tipo==='Combustible'), gal=comb.reduce((a,g)=>a+num(g.galones),0);
  const util=ing-gas;
  const alerts=[];

function letras(n){
  n=Math.floor(Math.abs(n));if(n===0)return'cero pesos';if(n===1)return'un peso';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const H=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const ap=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const d2=n=>n<30?U[n]:T[Math.floor(n/10)]+(n%10?' y '+U[n%10]:'');
  const d3=n=>n===100?'cien':[H[Math.floor(n/100)],n%100?d2(n%100):''].filter(Boolean).join(' ');
  const d6=n=>{const t=Math.floor(n/1000),r=n%1000;return[t===0?'':t===1?'mil':ap(d3(t))+' mil',r?d3(r):''].filter(Boolean).join(' ')};
  const m=Math.floor(n/1e6),r=n%1e6;
  let s=[m===0?'':m===1?'un millón':ap(d6(m))+' millones',r?d6(r):''].filter(Boolean).join(' ');
  s=ap(s);return s+(r===0?' de pesos':' pesos');
}

   <div class="doc"><b>${esc(f.tipoDoc||e.tipoDoc||'Cuenta de cobro')}</b><span class="no">N.º ${esc(numFact(f))}</span><div>Fecha: ${fdate(f.fecha)}</div></div></div>
  <div class="cli"><div><div class="lbl">Cliente</div><b>${esc(f.cliente)}</b></div><div><div class="lbl">NIT / C.C.</div>${esc(f.clienteId||'—')}</div>
   <div><div class="lbl">Dirección</div>${esc(f.clienteDir||'—')}</div><div><div class="lbl">Teléfono</div>${esc(f.clienteTel||'—')}</div></div>
  <table><thead><tr><th>Fecha</th><th>Descripción del servicio</th><th>Placa</th><th class="num">Km</th><th class="num">Valor</th></tr></thead><tbody>
  ${(f.items||[]).map(i=>`<tr><td>${fdate(i.fecha)}</td><td>${esc(i.desc)}</td><td>${esc(i.placa||'—')}</td><td class="num">${i.km?nf.format(i.km):'—'}</td><td class="num">${cop.format(num(i.valor))}</td></tr>`).join('')}
  <tr class="tot"><td colspan="4" style="text-align:right">TOTAL</td><td class="num">${cop.format(num(f.total))}</td></tr></tbody></table>
  <div class="let"><span class="lbl">Son:</span> ${esc(cap(letras(num(f.total))))} M/CTE</div>
  ${f.notas?`<p>${esc(f.notas)}</p>`:''}
  <div class="pie"><div>${e.pago?`<div class="lbl">Consignar a</div>${esc(e.pago)}`:''}${e.pie?`<p class="muted" style="color:#5d6570">${esc(e.pie)}</p>`:''}</div><div class="firma">Firma y sello<br>${esc(e.nombre||'')}</div></div>
  </div>`;
}
const invDlg=$('#inv');let invCur=null;
function openFacturar(ids){
  const vs=ids.map(id=>S.viajes.find(v=>v.id===id)).filter(v=>v&&!factOf(v)&&v.estado!=='Cancelado').sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(!vs.length){toast('Esos viajes ya están facturados.');return}
  const items=vs.map(v=>{const vh=veh(v.vehiculo);return{viajeId:v.id,fecha:v.fecha,desc:`Servicio de transporte ${v.origen||''} → ${v.destino||''}`.trim(),placa:vh?vh.placa:'',km:v.km||null,valor:num(v.valor)}});
  const e=empresa();
  invCur={draft:{numero:nextNum(),prefijo:e.prefijo||'',tipoDoc:e.tipoDoc||'Cuenta de cobro',fecha:TODAY,cliente:vs[0].cliente||'',clienteId:'',clienteDir:'',clienteTel:'',notas:'',items,total:items.reduce((a,i)=>a+i.valor,0),estado:'Pendiente'}};
  $('#invTitle').textContent='Facturar '+vs.length+' viaje'+(vs.length>1?'s':'');
  const d=invCur.draft;
  $('#invBody').innerHTML=`<div class="igrid">
   <label for="i_cliente">Cliente *<input id="i_cliente" value="${esc(d.cliente)}"></label>
   <label for="i_clienteId">NIT o cédula<input id="i_clienteId"></label>
   <label for="i_clienteTel">Teléfono<input id="i_clienteTel"></label>
   <label for="i_clienteDir">Dirección<input id="i_clienteDir"></label>
   <label for="i_fecha">Fecha<input id="i_fecha" type="date" value="${d.fecha}"></label>
   <label for="i_numero">Número<input id="i_numero" type="number" min="1" value="${d.numero}"></label>
   <label for="i_notas" style="grid-column:1/-1">Nota (opcional)<input id="i_notas" placeholder="Ej.: pago a 15 días"></label></div>
   <div class="paper" id="invPrev"></div>`;
  $('#invFoot').innerHTML=`<button type="button" class="left" data-empresa2="1">Datos de la empresa</button><button type="button" data-cerrar="1">Cancelar</button><button type="submit" class="primary">Guardar factura</button>`;
  prev();invDlg.showModal();
}
function readDraft(){const d=invCur.draft;['cliente','clienteId','clienteTel','clienteDir','fecha','notas'].forEach(k=>d[k]=$('#i_'+k).value.trim());d.numero=num($('#i_numero').value)||d.numero;return d}
function prev(){if(invCur&&invCur.draft&&$('#invPrev'))$('#invPrev').innerHTML=invoiceHTML({...readDraft(),empresa:empresa()})}
$('#invBody').addEventListener('input',prev);
$('#invFrm').addEventListener('submit',async e=>{
  e.preventDefault();if(!invCur||!invCur.draft)return;
  const d=readDraft();
  if(!d.cliente){$('#i_cliente').focus();toast('Escribe el nombre del cliente.');return}
  if(S.facturas.some(f=>num(f.numero)===d.numero&&(f.prefijo||'')===d.prefijo)){toast('Ya existe la factura número '+d.numero+'.');return}
  const id=uid();const{id:_e,...emp}=empresa();const rec={...d,empresa:emp};
  try{
    await save('facturas',id,rec);
    for(const it of d.items){const v=S.viajes.find(x=>x.id===it.viajeId);if(v){const{id:vid,...vd}=v;await save('viajes',vid,{...vd,factura:id,cliente:vd.cliente||d.cliente})}}
    d.items.forEach(i=>ui.sel.delete(i.viajeId));
    toast('Factura '+numFact(d)+' guardada · generando PDF…');showFactura({...rec,id});render();
    archivarPdf({...rec,id});
  }catch(err){toast(errMsg(err))}
});

/* ---------- PDF: generar y guardar en el archivo ---------- */
const pdfName=f=>`${(f.tipoDoc||'Factura').replace(/\s+/g,'-')}-${numFact(f)}.pdf`;
let pdfLib=null;
function loadPdfLib(){
  if(window.html2pdf)return Promise.resolve(window.html2pdf);
  if(!pdfLib)pdfLib=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=()=>ok(window.html2pdf);s.onerror=()=>{pdfLib=null;ko(new Error('pdf'))};document.head.appendChild(s)});
  return pdfLib;
}
async function makePdf(f){
  const h2p=await loadPdfLib();
  try{await document.fonts.ready}catch(e){}
  const st=document.createElement('div');st.id='pdfStage';st.innerHTML=invoiceHTML(f);document.body.appendChild(st);
  try{
    return await h2p().set({margin:[12,12,12,12],filename:pdfName(f),image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(st.firstElementChild).outputPdf('blob');
  }finally{st.remove()}
}
let assetsCap;
async function getAssets(){if(assetsCap===undefined){try{assetsCap=window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){assetsCap=null}}return assetsCap}
// Genera el PDF de la factura y lo guarda en el archivo de la app (queda enlazado a la factura).
async function archivarPdf(f){
  let blob;
  try{blob=await makePdf(f)}catch(e){toast('No se pudo generar el PDF. Revisa tu conexión.');return false}
  const as=await getAssets();
  if(!as||mode!=='db'){toast('PDF generado. Para guardarlo en el archivo abre la app desde tu cuenta de Claude.');return false}
  try{
    const r=await as.upload(new File([blob],pdfName(f),{type:'application/pdf'}));
    const cur=S.facturas.find(x=>x.id===f.id)||f;const{id,...d}=cur;
    await save('facturas',id,{...d,pdfId:r.id,pdfUrl:r.url,pdfAt:new Date().toISOString()});
    toast('PDF '+pdfName(f)+' guardado en el archivo');
    if(invDlg.open&&invCur&&invCur.view&&invCur.view.id===id)showFactura({...d,id,pdfId:r.id,pdfUrl:r.url});
    return true;
  }catch(e){toast('No se pudo guardar el PDF en el archivo.');return false}
}
async function pdfBlob(f){
  if(f.pdfUrl){try{const r=await fetch(f.pdfUrl);if(r.ok)return await r.blob()}catch(e){}}
  return makePdf(f);
}
function verFactura(id){const f=S.facturas.find(x=>x.id===id);if(f)showFactura(f)}
let dlCap;
async function showFactura(f){
  invCur={view:f};
  $('#invTitle').textContent=(f.tipoDoc||'Factura')+' '+numFact(f);
  $('#invBody').innerHTML=`<div class="paper">${invoiceHTML(f)}</div>`;
  if(dlCap===undefined){try{dlCap=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dlCap=null}}
  const inClaude=mode==='db';
  $('#invFoot').innerHTML=`${f.estado!=='Anulada'?`<button type="button" class="danger left" data-anular="1">Anular</button>`:''}<button type="button" data-cerrar="1">Cerrar</button>${!inClaude?`<button type="button" data-imprimir="1">Imprimir</button>`:''}${f.pdfUrl?`<a class="btn" href="${esc(f.pdfUrl)}" target="_blank" rel="noopener">Abrir PDF</a>`:inClaude?`<button type="button" data-archivar="1">Guardar PDF en archivo</button>`:''}${dlCap?`<button type="button" class="primary" data-descargar="1">Descargar PDF</button>`:''}`;
  if(!invDlg.open)invDlg.showModal();
}
let anularArmed=false;
$('#invFoot').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cerrar){invDlg.close();invCur=null}
  if(b.dataset.empresa2){invDlg.close();openForm('config','empresa')}
  if(b.dataset.imprimir){$('#printArea').innerHTML=invoiceHTML(invCur.view);window.print()}
  if(b.dataset.archivar){b.disabled=true;b.textContent='Generando…';if(!await archivarPdf(invCur.view)){b.disabled=false;b.textContent='Guardar PDF en archivo'}}
  if(b.dataset.descargar){
    const f=invCur.view;b.disabled=true;const t=b.textContent;b.textContent='Preparando PDF…';
    try{const blob=await pdfBlob(f);await dlCap.save({filename:pdfName(f),data:blob});toast('PDF descargado')}
    catch(err){if(!(err&&err.code==='declined'))toast(err&&err.code?'No se pudo descargar el PDF.':'No se pudo generar el PDF. Revisa tu conexión.')}
    finally{b.disabled=false;b.textContent=t}
  }
  if(b.dataset.anular){
    if(!anularArmed){anularArmed=true;b.textContent='¿Anular? Toca otra vez';setTimeout(()=>{anularArmed=false},4000);return}
    anularArmed=false;const f=invCur.view;const{id,...d}=f;
    try{await save('facturas',id,{...d,estado:'Anulada'});
      for(const it of f.items||[]){const v=S.viajes.find(x=>x.id===it.viajeId);if(v&&v.factura===id){const{id:vid,factura,...vd}=v;await save('viajes',vid,vd)}}
      invDlg.close();toast('Factura anulada; los viajes quedan libres para facturar de nuevo')}catch(err){toast(errMsg(err))}
  }
});
estadoCls.Pendiente='warn';estadoCls.Pagada='ok';estadoCls.Anulada='bad';

render();initStore();
</script>
