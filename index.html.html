<title>Control de Flota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior con pestañas tipo señal vial; cada pestaña es una tabla operativa con su formulario en un diálogo. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15191e; --muted:#5d6570; --line:#d5d9de; --soft:#e4e7eb;
  --plate:#f2c400; --plate-ink:#111111;
  --ok:#1d7f47; --warn:#a8670f; --bad:#c22f2f;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#191e24; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b323a; --soft:#222830;
  --ok:#4cc27f; --warn:#e3a840; --bad:#f06b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 0}
.brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:26px;height:26px;background:var(--plate);border:2px solid var(--plate-ink);border-radius:4px;transform:rotate(45deg) scale(.8)}
.mode{font-size:13px;color:var(--muted);margin-left:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav a{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--plate)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
main{padding-block:20px 48px}
.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.sub{color:var(--muted);margin:2px 0 0}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:600}
button.link:hover{color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{width:auto;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi b.neg{color:var(--bad)} .kpi b.pos{color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px}
td.act{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.placa{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:4px;padding:1px 8px 0;font-family:var(--font-mono);font-weight:700;font-size:14px;letter-spacing:.06em;line-height:1.2;white-space:nowrap}
.placa small{font-family:var(--font-body);font-size:8px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;line-height:1.1;padding-bottom:1px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mu{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--soft);border-left:4px solid var(--warn)}
.alerts li.bad{border-left-color:var(--bad)}
.alerts li div{flex:1;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.btrack{display:flex;flex-direction:column;gap:3px}
.b{height:10px;border-radius:2px;min-width:2px}
.b.in{background:var(--ok)} .b.out{background:var(--bad);opacity:.75}
.bnum{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,12,15,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line)}
.db{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto}
.db .full{grid-column:1/-1}
@media (max-width:480px){.db{grid-template-columns:1fr}}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

<header><div class="wrap">
  <div class="top"><div class="brand"><i aria-hidden="true"></i>Control de Flota</div><div class="mode" id="mode">Cargando datos…</div></div>
  <nav id="nav">
    <a href="#resumen">Resumen</a><a href="#viajes">Viajes</a><a href="#vehiculos">Vehículos</a><a href="#conductores">Conductores</a><a href="#gastos">Gastos</a>
  </nav>
</div></header>
<main class="wrap" id="main"></main>

<dialog id="dlg"><form id="frm" novalidate>
  <div class="dh"><h2 id="dlgTitle" style="margin:0">Nuevo</h2></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button type="button" class="danger left" id="delBtn" hidden>Eliminar</button><button type="button" id="cancelBtn">Cancelar</button><button type="submit" class="primary" id="saveBtn">Guardar</button></div>
</form></dialog>

<script>
const COLS=['vehiculos','conductores','viajes','gastos'];
const S={vehiculos:[],conductores:[],viajes:[],gastos:[]};
const loaded={};
let mode='loading', db=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const nf=new Intl.NumberFormat('es-CO');
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const THIS_MONTH=TODAY.slice(0,7);
const days=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5):null;
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const num=v=>Number(v)||0;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const ui={viajesMes:THIS_MONTH,gastosMes:THIS_MONTH,resumenMes:THIS_MONTH,viajesVeh:'',gastosVeh:''};

/* ---------- Esquemas de formularios ---------- */
const vehOpts=()=>S.vehiculos.map(v=>[v.id,v.placa+(v.marca?' · '+v.marca+' '+(v.modelo||''):'')]);
const condOpts=()=>S.conductores.map(c=>[c.id,c.nombre]);
const SCHEMA={
  vehiculos:{one:'vehículo',fields:[
    {k:'placa',l:'Placa',req:1,ph:'ABC123'},{k:'ciudad',l:'Ciudad de matrícula',ph:'Medellín'},
    {k:'marca',l:'Marca',ph:'Renault'},{k:'modelo',l:'Línea / modelo',ph:'Duster'},
    {k:'anio',l:'Año',t:'number'},{k:'tipo',l:'Tipo',t:'select',o:['Automóvil','Camioneta','Campero','Van','Taxi']},
    {k:'km',l:'Kilometraje actual',t:'number'},{k:'estado',l:'Estado',t:'select',o:['Activo','En taller','Inactivo']},
    {k:'soat',l:'Vence SOAT',t:'date'},{k:'tecno',l:'Vence técnico-mecánica',t:'date'}]},
  conductores:{one:'conductor',fields:[
    {k:'nombre',l:'Nombre completo',req:1,full:1},{k:'cedula',l:'Cédula'},{k:'telefono',l:'Celular',ph:'300 000 0000'},
    {k:'categoria',l:'Categoría licencia',t:'select',o:['B1','B2','B3','C1','C2','C3']},{k:'licencia',l:'Vence licencia',t:'date'},
    {k:'vehiculo',l:'Vehículo asignado',t:'select',opts:vehOpts,blank:'Sin asignar',full:1}]},
  viajes:{one:'viaje',fields:[
    {k:'fecha',l:'Fecha',t:'date',req:1,def:()=>TODAY},{k:'estado',l:'Estado',t:'select',o:['Programado','En curso','Completado','Cancelado']},
    {k:'vehiculo',l:'Vehículo',t:'select',opts:vehOpts,req:1},{k:'conductor',l:'Conductor',t:'select',opts:condOpts,blank:'—'},
    {k:'origen',l:'Origen',req:1},{k:'destino',l:'Destino',req:1},
    {k:'cliente',l:'Cliente / pasajero'},{k:'km',l:'Km recorridos',t:'number'},
    {k:'valor',l:'Valor cobrado (COP)',t:'number',full:1},{k:'notas',l:'Notas',t:'textarea',full:1}]},
  gastos:{one:'gasto',fields:[
    {k:'fecha',l:'Fecha',t:'date',req:1,def:()=>TODAY},{k:'tipo',l:'Tipo',t:'select',o:['Combustible','Mantenimiento','Peaje','Parqueadero','Lavado','Llantas','Seguro','Otro']},
    {k:'vehiculo',l:'Vehículo',t:'select',opts:vehOpts,req:1},{k:'valor',l:'Valor (COP)',t:'number',req:1},
    {k:'galones',l:'Galones (si es combustible)',t:'number',step:'0.01'},{k:'km',l:'Kilometraje al momento',t:'number'},
    {k:'detalle',l:'Detalle',t:'textarea',full:1}]}
};

/* ---------- Almacenamiento ---------- */
function lsGet(c){try{return JSON.parse(localStorage.getItem('flota_'+c)||'[]')}catch(e){return []}}
function lsSet(c){try{localStorage.setItem('flota_'+c,JSON.stringify(S[c]))}catch(e){}}
async function initStore(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    mode='db';$('#mode').textContent='Datos guardados en la nube';
    COLS.forEach(c=>{
      const t=setTimeout(()=>{$('#mode').textContent='Sin conexión con los datos todavía'},10000);
      db.collection(c).onSnapshot(s=>{
        S[c]=s.docs.map(d=>({...d.data(),id:d.id}));
        if(!s.metadata.fromCache){clearTimeout(t);loaded[c]=true;$('#mode').textContent='Datos guardados en la nube'}
        render();
      },e=>{clearTimeout(t);loaded[c]=true;toast('No se pudieron cargar los '+c+'. Recarga la página.');render()});
    });
  }else{
    mode='local';COLS.forEach(c=>{S[c]=lsGet(c);loaded[c]=true});
    $('#mode').textContent='Guardado solo en este navegador';render();
  }
}
async function save(c,id,data){
  if(mode==='db'){
    if(id) await db.collection(c).doc(id).set(data); else await db.collection(c).add(data);
  }else{
    if(id){const i=S[c].findIndex(x=>x.id===id);S[c][i]={...data,id}}else S[c].push({...data,id:uid()});
    lsSet(c);render();
  }
}
async function remove(c,id){
  if(mode==='db') await db.collection(c).doc(id).delete();
  else{S[c]=S[c].filter(x=>x.id!==id);lsSet(c);render()}
}

/* ---------- Utilidades de vista ---------- */
const veh=id=>S.vehiculos.find(v=>v.id===id);
const cond=id=>S.conductores.find(c=>c.id===id);
function placa(v){if(!v)return'<span class="muted">—</span>';const p=String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const f=p.length===6?p.slice(0,3)+' '+p.slice(3):p;return`<span class="placa">${esc(f)}${v.ciudad?`<small>${esc(v.ciudad)}</small>`:''}</span>`}
function venc(d){const n=days(d);if(n===null)return'<span class="pill mu">Sin fecha</span>';if(n<0)return`<span class="pill bad">Vencido ${fdate(d)}</span>`;if(n<=30)return`<span class="pill warn">${n===0?'Vence hoy':'En '+n+' días'}</span>`;return`<span class="pill ok">${fdate(d)}</span>`}
const estadoCls={Activo:'ok','En taller':'warn',Inactivo:'mu',Programado:'mu','En curso':'warn',Completado:'ok',Cancelado:'bad'};
const pill=e=>e?`<span class="pill ${estadoCls[e]||'mu'}">${esc(e)}</span>`:'';
const isLoading=()=>COLS.some(c=>!loaded[c]);
function emptyRow(cols,title,txt){return`<tr><td colspan="${cols}"><div class="empty"><b>${isLoading()?'Cargando…':title}</b>${isLoading()?'':txt}</div></td></tr>`}
const vehSelect=(id,val)=>`<label>Vehículo<select id="${id}"><option value="">Todos</option>${S.vehiculos.map(v=>`<option value="${v.id}"${v.id===val?' selected':''}>${esc(v.placa)}</option>`).join('')}</select></label>`;

/* ---------- Vistas ---------- */
function vResumen(){
  const m=ui.resumenMes;
  const vj=S.viajes.filter(x=>(x.fecha||'').startsWith(m)&&x.estado!=='Cancelado');
  const gs=S.gastos.filter(x=>(x.fecha||'').startsWith(m));
  const ing=vj.reduce((a,x)=>a+num(x.valor),0), gas=gs.reduce((a,x)=>a+num(x.valor),0), km=vj.reduce((a,x)=>a+num(x.km),0);
  const comb=gs.filter(g=>g.tipo==='Combustible'), gal=comb.reduce((a,g)=>a+num(g.galones),0);
  const util=ing-gas;
  const alerts=[];
  S.vehiculos.forEach(v=>{[['soat','SOAT'],['tecno','Técnico-mecánica']].forEach(([k,l])=>{const n=days(v[k]);if(n!==null&&n<=30)alerts.push({n,html:`${placa(v)}<div><b>${l}</b> <span class="muted">· ${fdate(v[k])}</span></div>${venc(v[k])}`})})});
  S.conductores.forEach(c=>{const n=days(c.licencia);if(n!==null&&n<=30)alerts.push({n,html:`<div><b>Licencia de ${esc(c.nombre)}</b> <span class="muted">· ${fdate(c.licencia)}</span></div>${venc(c.licencia)}`})});
  alerts.sort((a,b)=>a.n-b.n);
  const per=S.vehiculos.map(v=>({v,i:vj.filter(x=>x.vehiculo===v.id).reduce((a,x)=>a+num(x.valor),0),g:gs.filter(x=>x.vehiculo===v.id).reduce((a,x)=>a+num(x.valor),0)})).filter(r=>r.i||r.g);
  const mx=Math.max(1,...per.map(r=>Math.max(r.i,r.g)));
  const prox=S.viajes.filter(x=>x.fecha>=TODAY&&(x.estado==='Programado'||x.estado==='En curso')).sort((a,b)=>a.fecha<b.fecha?-1:1).slice(0,6);
  const mesLbl=new Date(m+'-01T00:00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  return`<div class="bar"><div class="grow"><h1>Resumen</h1><p class="sub">Movimiento de ${mesLbl} · ${S.vehiculos.filter(v=>v.estado!=='Inactivo').length} vehículos en operación</p></div>
  <div class="filters"><label>Mes<input type="month" id="fResMes" value="${m}"></label></div></div>
  <div class="kpis">
   <div class="kpi"><span>Viajes</span><b>${nf.format(vj.length)}</b></div>
   <div class="kpi"><span>Kilómetros</span><b>${nf.format(km)}</b></div>
   <div class="kpi"><span>Ingresos</span><b>${cop.format(ing)}</b></div>
   <div class="kpi"><span>Gastos</span><b>${cop.format(gas)}</b></div>
   <div class="kpi"><span>Utilidad</span><b class="${util<0?'neg':'pos'}">${cop.format(util)}</b></div>
   <div class="kpi"><span>Combustible</span><b>${nf.format(Math.round(gal*10)/10)} gal</b></div>
  </div>
  <div class="cols">
   <section class="panel"><h2>Documentos por vencer</h2>${alerts.length?`<ul class="alerts">${alerts.map(a=>`<li class="${a.n<0?'bad':''}">${a.html}</li>`).join('')}</ul>`:`<div class="empty"><b>${isLoading()?'Cargando…':'Todo al día'}</b>${isLoading()?'':'Ningún SOAT, técnico-mecánica o licencia vence en los próximos 30 días.'}</div>`}</section>
   <section class="panel"><h2>Ingresos y gastos por vehículo</h2>${per.length?`<div class="legend"><span><i style="background:var(--ok)"></i>Ingresos</span><span><i style="background:var(--bad);opacity:.75"></i>Gastos</span></div><div class="bars">${per.map(r=>`<div class="brow">${placa(r.v)}<div class="btrack"><div class="b in" style="width:${r.i/mx*100}%"></div><div class="bnum">${cop.format(r.i)}</div><div class="b out" style="width:${r.g/mx*100}%"></div><div class="bnum">${cop.format(r.g)}</div></div></div>`).join('')}</div>`:`<div class="empty"><b>${isLoading()?'Cargando…':'Sin movimientos este mes'}</b>${isLoading()?'':'Registra viajes y gastos para ver la comparación.'}</div>`}</section>
  </div>
  <h2 style="margin-top:28px">Próximos viajes</h2>
  <div class="tbl"><table><thead><tr><th>Fecha</th><th>Vehículo</th><th>Conductor</th><th>Ruta</th><th>Estado</th></tr></thead><tbody>
  ${prox.length?prox.map(x=>`<tr><td>${fdate(x.fecha)}</td><td>${placa(veh(x.vehiculo))}</td><td>${esc(cond(x.conductor)?.nombre||'—')}</td><td>${esc(x.origen)} → ${esc(x.destino)}</td><td>${pill(x.estado)}</td></tr>`).join(''):emptyRow(5,'No hay viajes programados','Programa uno en la pestaña Viajes.')}
  </tbody></table></div>`;
}
function vViajes(){
  const rows=S.viajes.filter(x=>(!ui.viajesMes||(x.fecha||'').startsWith(ui.viajesMes))&&(!ui.viajesVeh||x.vehiculo===ui.viajesVeh)).sort((a,b)=>a.fecha<b.fecha?1:-1);
  const tot=rows.filter(x=>x.estado!=='Cancelado').reduce((a,x)=>a+num(x.valor),0);
  return`<div class="bar"><div class="grow"><h1>Viajes</h1><p class="sub">${rows.length} viajes · ${cop.format(tot)} cobrados</p></div>
  <div class="filters"><label>Mes<input type="month" id="fViaMes" value="${ui.viajesMes}"></label>${vehSelect('fViaVeh',ui.viajesVeh)}</div>
  <button class="primary" data-new="viajes">+ Nuevo viaje</button></div>
  <div class="tbl"><table><thead><tr><th>Fecha</th><th>Vehículo</th><th>Conductor</th><th>Ruta</th><th>Cliente</th><th class="num">Km</th><th class="num">Valor</th><th>Estado</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(x=>`<tr><td>${fdate(x.fecha)}</td><td>${placa(veh(x.vehiculo))}</td><td>${esc(cond(x.conductor)?.nombre||'—')}</td><td>${esc(x.origen)} → ${esc(x.destino)}</td><td>${esc(x.cliente||'—')}</td><td class="num">${x.km?nf.format(x.km):'—'}</td><td class="num">${x.valor?cop.format(x.valor):'—'}</td><td>${pill(x.estado)}</td><td class="act"><button class="link" data-edit="viajes" data-id="${x.id}">Editar</button></td></tr>`).join(''):emptyRow(9,'Sin viajes en este periodo','Usa “Nuevo viaje” para registrar el primero.')}
  </tbody></table></div>`;
}
function vVehiculos(){
  const rows=[...S.vehiculos].sort((a,b)=>(a.placa||'').localeCompare(b.placa||''));
  return`<div class="bar"><div class="grow"><h1>Vehículos</h1><p class="sub">${rows.length} carros registrados</p></div><button class="primary" data-new="vehiculos">+ Nuevo vehículo</button></div>
  <div class="tbl"><table><thead><tr><th>Placa</th><th>Vehículo</th><th>Tipo</th><th class="num">Km</th><th>SOAT</th><th>Técnico-mecánica</th><th>Conductor</th><th>Estado</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(v=>{const c=S.conductores.find(c=>c.vehiculo===v.id);return`<tr><td>${placa(v)}</td><td>${esc([v.marca,v.modelo].filter(Boolean).join(' ')||'—')}${v.anio?` <span class="muted">${esc(v.anio)}</span>`:''}</td><td>${esc(v.tipo||'—')}</td><td class="num">${v.km?nf.format(v.km):'—'}</td><td>${venc(v.soat)}</td><td>${venc(v.tecno)}</td><td>${esc(c?.nombre||'—')}</td><td>${pill(v.estado)}</td><td class="act"><button class="link" data-edit="vehiculos" data-id="${v.id}">Editar</button></td></tr>`}).join(''):emptyRow(9,'Aún no hay vehículos','Registra tu primer carro con “Nuevo vehículo”.')}
  </tbody></table></div>`;
}
function vConductores(){
  const rows=[...S.conductores].sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  return`<div class="bar"><div class="grow"><h1>Conductores</h1><p class="sub">${rows.length} conductores</p></div><button class="primary" data-new="conductores">+ Nuevo conductor</button></div>
  <div class="tbl"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Celular</th><th>Licencia</th><th>Vencimiento</th><th>Vehículo</th><th class="num">Viajes del mes</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(c=>`<tr><td><b>${esc(c.nombre)}</b></td><td class="num" style="text-align:left">${esc(c.cedula||'—')}</td><td>${esc(c.telefono||'—')}</td><td>${esc(c.categoria||'—')}</td><td>${venc(c.licencia)}</td><td>${placa(veh(c.vehiculo))}</td><td class="num">${S.viajes.filter(x=>x.conductor===c.id&&(x.fecha||'').startsWith(THIS_MONTH)).length}</td><td class="act"><button class="link" data-edit="conductores" data-id="${c.id}">Editar</button></td></tr>`).join(''):emptyRow(8,'Aún no hay conductores','Agrega uno con “Nuevo conductor”.')}
  </tbody></table></div>`;
}
function vGastos(){
  const rows=S.gastos.filter(x=>(!ui.gastosMes||(x.fecha||'').startsWith(ui.gastosMes))&&(!ui.gastosVeh||x.vehiculo===ui.gastosVeh)).sort((a,b)=>a.fecha<b.fecha?1:-1);
  const tot=rows.reduce((a,x)=>a+num(x.valor),0);
  const byT={};rows.forEach(r=>byT[r.tipo||'Otro']=(byT[r.tipo||'Otro']||0)+num(r.valor));
  return`<div class="bar"><div class="grow"><h1>Gastos</h1><p class="sub">${cop.format(tot)} en ${rows.length} registros${Object.keys(byT).length?' · '+Object.entries(byT).sort((a,b)=>b[1]-a[1]).map(([t,v])=>esc(t)+' '+cop.format(v)).join(' · '):''}</p></div>
  <div class="filters"><label>Mes<input type="month" id="fGasMes" value="${ui.gastosMes}"></label>${vehSelect('fGasVeh',ui.gastosVeh)}</div>
  <button class="primary" data-new="gastos">+ Nuevo gasto</button></div>
  <div class="tbl"><table><thead><tr><th>Fecha</th><th>Vehículo</th><th>Tipo</th><th>Detalle</th><th class="num">Galones</th><th class="num">$/galón</th><th class="num">Valor</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(g=>`<tr><td>${fdate(g.fecha)}</td><td>${placa(veh(g.vehiculo))}</td><td>${esc(g.tipo||'—')}</td><td>${esc(g.detalle||'—')}</td><td class="num">${g.galones?nf.format(g.galones):'—'}</td><td class="num">${g.galones&&g.valor?cop.format(g.valor/g.galones):'—'}</td><td class="num">${cop.format(num(g.valor))}</td><td class="act"><button class="link" data-edit="gastos" data-id="${g.id}">Editar</button></td></tr>`).join(''):emptyRow(8,'Sin gastos en este periodo','Registra tanqueos, peajes o mantenimientos con “Nuevo gasto”.')}
  </tbody></table></div>`;
}
const VIEWS={resumen:vResumen,viajes:vViajes,vehiculos:vVehiculos,conductores:vConductores,gastos:vGastos};
function route(){const h=location.hash.slice(1);return VIEWS[h]?h:'resumen'}
function render(){
  const r=route();
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const note=mode==='local'?'<div class="note">Esta vista guarda los datos solo en este navegador. Ábrela desde Claude con tu cuenta para guardarlos en la nube.</div>':'';
  $('#main').innerHTML=note+VIEWS[r]();
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- Filtros y botones ---------- */
$('#main').addEventListener('change',e=>{
  const id=e.target.id, v=e.target.value;
  const map={fResMes:'resumenMes',fViaMes:'viajesMes',fViaVeh:'viajesVeh',fGasMes:'gastosMes',fGasVeh:'gastosVeh'};
  if(map[id]){ui[map[id]]=v;render()}
});
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.new)openForm(b.dataset.new);
  if(b.dataset.edit)openForm(b.dataset.edit,b.dataset.id);
});

/* ---------- Formulario ---------- */
const dlg=$('#dlg');let cur=null,delArmed=false;
function field(f,val){
  const id='f_'+f.k, req=f.req?' required':'', cls=f.full?' class="full"':'';
  let inp;
  if(f.t==='select'){
    const opts=f.opts?f.opts():f.o.map(o=>[o,o]);
    inp=`<select id="${id}" name="${f.k}"${req}>${f.blank||f.opts?`<option value="">${esc(f.blank||'Selecciona…')}</option>`:''}${opts.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  }else if(f.t==='textarea') inp=`<textarea id="${id}" name="${f.k}" rows="2">${esc(val)}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}"${f.t==='number'?` inputmode="decimal" step="${f.step||'any'}" min="0"`:''} value="${esc(val)}" placeholder="${esc(f.ph||'')}"${req}>`;
  return`<label${cls} for="${id}">${esc(f.l)}${f.req?' *':''}${inp}</label>`;
}
function openForm(c,id){
  const sc=SCHEMA[c], rec=id?S[c].find(x=>x.id===id):null;
  if((c==='viajes'||c==='gastos')&&!S.vehiculos.length){toast('Primero registra al menos un vehículo.');location.hash='vehiculos';return}
  cur={c,id};delArmed=false;
  $('#dlgTitle').textContent=(rec?'Editar ':'Nuevo ')+sc.one;
  $('#dlgBody').innerHTML=sc.fields.map(f=>field(f,rec?rec[f.k]:(f.def?f.def():(f.t==='select'&&f.o?f.o[0]:'')))).join('');
  if(c==='viajes'&&!rec&&ui.viajesVeh)$('#f_vehiculo').value=ui.viajesVeh;
  $('#delBtn').hidden=!rec;$('#delBtn').textContent='Eliminar';
  dlg.showModal();
}
// Al elegir vehículo en un viaje, sugiere el conductor asignado
$('#dlgBody').addEventListener('change',e=>{
  if(cur?.c==='viajes'&&e.target.id==='f_vehiculo'){const c=S.conductores.find(c=>c.vehiculo===e.target.value);if(c&&!$('#f_conductor').value)$('#f_conductor').value=c.id}
});
$('#cancelBtn').onclick=()=>dlg.close();
$('#delBtn').onclick=async()=>{
  if(!delArmed){delArmed=true;$('#delBtn').textContent='¿Seguro? Toca otra vez';return}
  try{await remove(cur.c,cur.id);dlg.close();toast('Eliminado')}catch(e){toast(errMsg(e))}
};
$('#frm').addEventListener('submit',async e=>{
  e.preventDefault();
  const sc=SCHEMA[cur.c], data={};
  for(const f of sc.fields){
    let v=$('#f_'+f.k).value.trim();
    if(f.req&&!v){$('#f_'+f.k).focus();toast('Completa: '+f.l);return}
    if(f.t==='number')v=v===''?null:Number(v);
    if(f.k==='placa')v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');
    data[f.k]=v;
  }
  if(cur.c==='vehiculos'&&S.vehiculos.some(v=>v.placa===data.placa&&v.id!==cur.id)){toast('Ya existe un vehículo con la placa '+data.placa);return}
  $('#saveBtn').disabled=true;
  try{await save(cur.c,cur.id,data);dlg.close();toast('Guardado')}catch(err){toast(errMsg(err))}
  finally{$('#saveBtn').disabled=false}
});
function errMsg(e){if(e&&e.code==='invalid_argument')return'No tienes permiso para editar estos datos.';if(e&&e.code==='quota_exceeded')return'Se llenó el espacio de datos. Elimina registros viejos.';return'No se pudo guardar. Intenta de nuevo.'}
let tt;function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2600)}

render();initStore();
</script>
